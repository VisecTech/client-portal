# portal.uplink.net.au — Uplink client portal (Next.js standalone on 127.0.0.1:3110)
limit_req_zone $binary_remote_addr zone=portal_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name portal.uplink.net.au;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.uplink.net.au;

    ssl_certificate     /etc/letsencrypt/live/portal.uplink.net.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.uplink.net.au/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 64k;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Sign-in: a few attempts a minute per address. Flyleaf also caps links per contact.
    location ~ ^/(login|auth) {
        limit_req zone=portal_auth burst=5 nodelay;
        include proxy_params;
        proxy_pass http://127.0.0.1:3110;
    }

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:3110;
    }
}
